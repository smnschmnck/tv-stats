services:
  ratings-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ratings-redis-data:/data
    command: redis-server --appendonly yes

  caching-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - caching-redis-data:/data
    command: redis-server --appendonly yes

volumes:
  ratings-redis-data:
  caching-redis-data:
